[package]
name = "bindgen-test"
authors = ["Kyle Mayes <kyle@mayeses.com>"]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Tests clang-sys by compiling and using bindgen."
publish = false

build = "build.rs"

[features]
runtime = ["bindgen/runtime"]
static = ["bindgen/static"]

[build-dependencies]
bindgen = { version = "*", default-features = false }
